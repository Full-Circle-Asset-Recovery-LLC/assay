name: CI

# Pull requests validate GitHub's proposed merge commit. The main push reruns
# affected checks against the immutable merged commit and is the only event
# allowed to produce a source-deployment artifact. Tag pushes (`v*`) are
# handled by release.yml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Detect what changed so independent surfaces only pay for their own gates.
  # CI config changes are validated by workflow-lint; they do not force
  # unrelated Rust, browser, extension, or sysops jobs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      assay_rust: ${{ steps.filter.outputs.assay_rust }}
      assay_lua_tests: ${{ steps.filter.outputs.assay_lua_tests }}
      engine_lua: ${{ steps.filter.outputs.engine_lua }}
      dashboard_e2e: ${{ steps.filter.outputs.dashboard_e2e }}
      engine_e2e: ${{ steps.filter.outputs.engine_e2e }}
      extension: ${{ steps.filter.outputs.extension }}
      sysops: ${{ steps.filter.outputs.sysops }}
      site: ${{ steps.filter.outputs.site }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4.0.1
        id: filter
        with:
          filters: |
            assay_rust:
              - '.github/ci/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/*/Cargo.toml'
              - 'crates/*/build.rs'
              - 'crates/*/src/**'
              - 'crates/*/examples/**'
              - 'crates/*/benches/**'
              - 'crates/*/tests/**/*.rs'
              # Refreshing a vendored conformance fixture changes what the
              # suite asserts without touching a line of Rust.
              - 'crates/assay-authz/conformance/**'
            assay_lua_tests:
              - 'crates/assay/moon.yml'
              - 'crates/assay/stdlib/**/*.lua'
              - 'crates/assay/tests/**/*.lua'
              - 'crates/assay/tests/stdlib_pkg.rs'
              - 'crates/assay/tests/stdlib_nspawn.rs'
              - 'crates/assay/tests/stdlib_rustic.rs'
              - 'crates/assay/tests/stdlib_fs_snapshot.rs'
            engine_lua:
              - 'crates/assay-engine/tests-lua/**'
              - 'crates/assay-engine/examples/init/**'
              - 'crates/assay-engine/src/**'
              - 'crates/assay-auth/src/**'
              - 'crates/assay-workflow/src/**'
              - 'crates/assay/stdlib/engine.lua'
              - 'crates/assay/stdlib/engine/**'
            dashboard_e2e:
              - 'crates/assay-workflow/tests-e2e/**'
              - 'crates/assay-dashboard/src/**'
              - 'crates/assay-workflow/src/api/**'
              - 'crates/assay-engine/src/**'
            engine_e2e:
              - 'crates/assay-engine/tests-e2e/**'
              - 'crates/assay-dashboard/src/**'
              - 'crates/assay-engine/src/**'
              - 'crates/assay-auth/src/**'
            extension:
              - 'openclaw-extension/**'
            sysops:
              - 'libs/sysops/**'
            site:
              - 'site/**'
              - 'docs/**'
              - 'CHANGELOG.md'
              - 'llms.txt'
              - 'crates/assay/src/lua/builtins/mod.rs'
              - 'crates/assay/stdlib/**'
            ci:
              - 'renovate.json'
              - '.github/ci/**'
              - '.github/workflows/**'
              - '.github/release/**'
              - '.mise.toml'
              - '.moon/**'
              - 'moon.yml'
              - 'rust-toolchain.toml'
              - 'scripts/**'

  # Fast parallel linting gate (fmt + clippy) on Ubuntu.
  # Keeps clippy execution out of the macOS runner, eliminating 7+ minutes
  # of multi-profile compilation contention on constrained hardware.
  rust-lint:
    name: rust-lint
    needs: changes
    if: needs.changes.outputs.assay_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@v4.0.1
        with:
          version: 2026.4.17
          install: true
          cache: true

      - name: Install clippy and rustfmt components
        run: rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-x86_64-unknown-linux-gnu-v4"
          key: ${{ hashFiles('**/Cargo.lock') }}
          cache-all-crates: "true"
          cache-targets: "true"

      - name: moon run assay-lua:fmt assay-lua:lint
        run: moon run assay-lua:fmt assay-lua:lint --color
        env:
          MOON_LOG: "info"

  # Sharded test execution across Linux and macOS.
  # Executes cargo test, stdlib tests, and integration suites without
  # unnecessary release-mode compilation.
  rust-test:
    name: rust-test
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    # Self-hosted runner routing.
    #
    # Linux row: routes to the maintainer's self-hosted runner whenever
    # the actor is the maintainer; any other actor (Dependabot, outside
    # contributors) falls back to `ubuntu-latest`.
    #
    # macOS row: opt-in, routed to the maintainer's local Mac only while
    # `vars.MAC_LOCAL_RUNNER == 'true'` (the same switch release.yml uses).
    # GitHub Actions cannot fall back from an offline self-hosted runner
    # once a job has been routed there, so this stays a deliberate toggle
    # rather than a default — flip the variable and the next run goes back
    # to GitHub-hosted ARM64 `macos-15` with no workflow edit. `macos-14`
    # remains only the legacy required-status identifier and selector;
    # its hosted image is retired, so the fallback maps it to `macos-15`:
    #
    #   gh variable set MAC_LOCAL_RUNNER --repo developerinlondon/assay --body false
    runs-on: >-
      ${{
        (matrix.os == 'ubuntu-latest' && github.actor == 'developerinlondon' && fromJSON('["self-hosted","linux","assay"]'))
        || (matrix.os == 'macos-14' && github.actor == 'developerinlondon' && vars.MAC_LOCAL_RUNNER == 'true' && fromJSON('["self-hosted","macos","assay"]'))
        || (matrix.os == 'macos-14' && 'macos-15')
        || matrix.os
      }}
    timeout-minutes: 30

    steps:
      - name: Select check targets
        id: targets
        shell: bash
        env:
          ASSAY_RUST: ${{ needs.changes.outputs.assay_rust }}
          ASSAY_LUA_TESTS: ${{ needs.changes.outputs.assay_lua_tests }}
          ENGINE_LUA: ${{ needs.changes.outputs.engine_lua }}
          SITE: ${{ needs.changes.outputs.site }}
        run: |
          set -euo pipefail
          targets=()

          if [[ "$ASSAY_RUST" == "true" ]]; then
            targets+=(assay-lua:test)
          elif [[ "$ASSAY_LUA_TESTS" == "true" ]]; then
            targets+=(assay-lua:test-lua-stdlib)
          fi

          if [[ "$ENGINE_LUA" == "true" ]]; then
            targets+=(engine-lua:test)
          fi

          if [[ "$SITE" == "true" ]]; then
            targets+=(site:build)
          fi

          if ((${#targets[@]} == 0)); then
            echo "run_checks=false" >> "$GITHUB_OUTPUT"
            echo "No Assay/runtime targets selected for this diff."
          else
            echo "run_checks=true" >> "$GITHUB_OUTPUT"
            echo "targets=${targets[*]}" >> "$GITHUB_OUTPUT"
            printf 'Selected check targets: %s\n' "${targets[*]}"
          fi

      - uses: actions/checkout@v6
        if: steps.targets.outputs.run_checks == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@v4.0.1
        if: steps.targets.outputs.run_checks == 'true'
        with:
          version: 2026.4.17
          install: true
          cache: true

      - name: Add ~/.cargo/bin to PATH (self-hosted)
        if: steps.targets.outputs.run_checks == 'true' && runner.environment == 'self-hosted'
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Use dedicated Cargo target dir (self-hosted)
        if: steps.targets.outputs.run_checks == 'true' && runner.environment == 'self-hosted' && runner.os == 'Linux'
        run: |
          mkdir -p /var/cache/runner-work/assay-target
          echo "CARGO_TARGET_DIR=/var/cache/runner-work/assay-target" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          rm -rf target
          ln -s /var/cache/runner-work/assay-target target

      - name: Install pinned assay-engine v0.5.15 baseline (Linux)
        if: steps.targets.outputs.run_checks == 'true' && needs.changes.outputs.assay_rust == 'true' && runner.os == 'Linux'
        run: |
          baseline=$(.github/ci/install-assay-engine-baseline.sh "$RUNNER_TEMP/assay-baseline")
          echo "ASSAY_TEST_BASELINE_BINARY=$baseline" >> "$GITHUB_ENV"

      - name: Install pinned assay-engine v0.5.15 baseline (macOS)
        if: steps.targets.outputs.run_checks == 'true' && needs.changes.outputs.assay_rust == 'true' && runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          baseline=$(python3 .github/ci/install-assay-engine-baseline-darwin.py "$RUNNER_TEMP/assay-baseline")
          echo "ASSAY_TEST_BASELINE_BINARY=$baseline" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        if: steps.targets.outputs.run_checks == 'true' && runner.environment == 'github-hosted'
        with:
          shared-key: "ci-${{ matrix.target }}-v4"
          key: ${{ hashFiles('**/Cargo.lock') }}
          cache-all-crates: "true"
          cache-targets: "true"

      - name: Start Postgres 18 (Linux)
        if: steps.targets.outputs.run_checks == 'true' && needs.changes.outputs.assay_rust == 'true' && runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          docker run -d --name assay-pg-test \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 \
            postgres:18-alpine
          for i in {1..30}; do
            if docker exec assay-pg-test pg_isready -U postgres -q; then
              echo "Postgres ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Postgres failed to become ready within 30s" >&2
          docker logs assay-pg-test >&2
          exit 1

      - name: Set TEST_DATABASE_URL (Linux)
        if: steps.targets.outputs.run_checks == 'true' && needs.changes.outputs.assay_rust == 'true' && runner.os == 'Linux'
        run: echo "TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres" >> "$GITHUB_ENV"

      - name: moon run selected checks
        if: steps.targets.outputs.run_checks == 'true'
        run: moon run ${{ steps.targets.outputs.targets }} --color
        env:
          MOON_LOG: "info"

      - name: Cleanup self-hosted Postgres test databases
        if: always() && steps.targets.outputs.run_checks == 'true' && needs.changes.outputs.assay_rust == 'true' && runner.os == 'Linux' && runner.environment == 'self-hosted'
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT pg_terminate_backend(pid)
          FROM pg_stat_activity
          WHERE datname LIKE 'assay_test_%';

          SELECT format('DROP DATABASE IF EXISTS %I WITH (FORCE);', datname)
          FROM pg_database
          WHERE datname LIKE 'assay_test_%'
          \gexec
          SQL

      - name: Docs are in sync (README stdlib table)
        if: steps.targets.outputs.run_checks == 'true' && needs.changes.outputs.site == 'true' && runner.os == 'Linux'
        run: |
          if ! git diff --exit-code -- README.md; then
            echo "::error title=README.md out of sync::Run 'assay site/build.lua' locally and commit the result. The stdlib table is generated from docs/modules/*.md frontmatter; edit those (or build.lua's category_order) — not README directly."
            exit 1
          fi

  # Required branch-protection aggregator check.
  # Materializes as 'check (ubuntu-latest, x86_64-unknown-linux-gnu)' and
  # 'check (macos-14, aarch64-apple-darwin)' to preserve 100% of branch-protection
  # check contexts, running in <5 seconds while aggregating the parallel shards.
  check:
    name: check (${{ matrix.os }}, ${{ matrix.target }})
    needs: [changes, rust-lint, rust-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - name: Verify aggregated quality gates
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.rust-lint.result }}
          TEST_RESULT: ${{ needs.rust-test.result }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.target }}
        run: |
          set -euo pipefail
          echo "Aggregating quality gate results for $TARGET_OS ($TARGET_ARCH)..."
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::changes paths-filter step did not succeed ($CHANGES_RESULT)"
            exit 1
          fi
          if [[ "$LINT_RESULT" == "failure" || "$LINT_RESULT" == "cancelled" ]]; then
            echo "::error::rust-lint quality gate failed or was cancelled ($LINT_RESULT)"
            exit 1
          fi
          if [[ "$TEST_RESULT" == "failure" || "$TEST_RESULT" == "cancelled" ]]; then
            echo "::error::rust-test quality gate failed or was cancelled ($TEST_RESULT)"
            exit 1
          fi
          echo "Quality gates for $TARGET_OS ($TARGET_ARCH) verified successfully."

  # Produce the native GNU binary used by source deployments only for the exact
  # commit pushed to main and only after the complete Linux/macOS check matrix
  # accepts that commit. Ubuntu 22.04 fixes the build ABI at glibc 2.35; the
  # packaging step also rejects any newer GLIBC symbol requirement. PR merge
  # refs are intentionally ineligible because their synthetic SHA is not the
  # eventual merged source revision.
  assay-engine-gnu-artifact:
    name: assay-engine GNU artifact
    needs: [changes, check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.assay_rust == 'true' && needs.check.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: assay-engine-gnu-release
          cache-targets: true

      - name: Verify exact clean source checkout
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Build native GNU assay-engine
        run: >-
          cargo build --locked --release --target x86_64-unknown-linux-gnu
          -p assay-engine --bin assay-engine

      - name: Package binary and provenance manifest
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          source_binary=target/x86_64-unknown-linux-gnu/release/assay-engine
          artifact_dir=dist/assay-engine-gnu
          artifact_name=assay-engine-x86_64-unknown-linux-gnu
          mkdir -p "$artifact_dir"
          install -m 0500 "$source_binary" "$artifact_dir/$artifact_name"

          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.35"
          readelf -l "$artifact_dir/$artifact_name" | grep -Fq '/lib64/ld-linux-x86-64.so.2'

          ARTIFACT_PATH="$artifact_dir/$artifact_name"
          ARTIFACT_NAME="$artifact_name"
          VERSION_OUTPUT="$("$ARTIFACT_PATH" --version)"
          RUSTC_VERSION="$(rustc --version)"
          CARGO_LOCK_SHA256="$(sha256sum Cargo.lock | awk '{print $1}')"
          ELF_BUILD_ID="$(readelf -n "$ARTIFACT_PATH" | awk '/Build ID:/{print $3; exit}')"
          [[ "$ELF_BUILD_ID" =~ ^[0-9a-f]{40}$ ]]
          BINARY_SHA256="$(sha256sum "$ARTIFACT_PATH" | awk '{print $1}')"
          BINARY_SIZE="$(wc -c < "$ARTIFACT_PATH" | tr -d '[:space:]')"
          GLIBC_MAX_REQUIRED="$(python3 - "$ARTIFACT_PATH" <<'PY'
          import re
          import subprocess
          import sys

          labels = set(
              re.findall(
                  rb"GLIBC_(\d+(?:\.\d+)+)",
                  subprocess.check_output(["readelf", "--version-info", sys.argv[1]]),
              )
          )
          versions = {tuple(map(int, label.split(b"."))) for label in labels}
          if not versions:
              raise SystemExit("binary has no GLIBC symbol requirements")
          maximum = max(versions)
          width = max(len(maximum), 2)
          padded_maximum = maximum + (0,) * (width - len(maximum))
          limit = (2, 35) + (0,) * (width - 2)
          rendered = ".".join(map(str, maximum))
          if padded_maximum > limit:
              raise SystemExit(f"binary requires GLIBC_{rendered}, newer than 2.35")
          print(rendered)
          PY
          )"
          export ARTIFACT_PATH ARTIFACT_NAME VERSION_OUTPUT RUSTC_VERSION CARGO_LOCK_SHA256
          export ELF_BUILD_ID BINARY_SHA256 BINARY_SIZE GLIBC_MAX_REQUIRED

          python3 - "$artifact_dir/manifest.json" <<'PY'
          import json
          import os
          import sys

          manifest = {
              "schema_version": 1,
              "source": {
                  "repository": os.environ["SOURCE_REPOSITORY"],
                  "commit": os.environ["SOURCE_SHA"],
                  "ref": os.environ["SOURCE_REF"],
                  "event_name": os.environ["SOURCE_EVENT_NAME"],
              },
              "workflow": {
                  "run_id": int(os.environ["WORKFLOW_RUN_ID"]),
                  "run_attempt": int(os.environ["WORKFLOW_RUN_ATTEMPT"]),
              },
              "builder": {
                  "runner": "ubuntu-22.04",
                  "target": "x86_64-unknown-linux-gnu",
                  "glibc": "2.35",
                  "rustc": os.environ["RUSTC_VERSION"],
                  "cargo_lock_sha256": os.environ["CARGO_LOCK_SHA256"],
              },
              "artifact": {
                  "name": os.environ["ARTIFACT_NAME"],
                  "sha256": os.environ["BINARY_SHA256"],
                  "size_bytes": int(os.environ["BINARY_SIZE"]),
                  "elf_build_id_sha1": os.environ["ELF_BUILD_ID"],
                  "glibc_max_required": os.environ["GLIBC_MAX_REQUIRED"],
                  "version_output": os.environ["VERSION_OUTPUT"],
              },
          }
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
          (cd "$artifact_dir" && sha256sum "$artifact_name" > SHA256SUMS)
          cat "$artifact_dir/manifest.json"
          cat "$artifact_dir/SHA256SUMS"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: assay-engine-gnu-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/assay-engine-gnu
          if-no-files-found: error
          retention-days: 14

  workflow-lint:
    name: workflow-lint
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Release changelog and workflow contract regression tests
        run: |
          python3 .github/release/test_extract_changelog.py
          python3 .github/ci/test_artifact_packaging.py
          python3 .github/ci/test_assay_engine_baseline_darwin.py
          python3 scripts/test_ci_workflow_contract.py

      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/ci.yml .github/workflows/deploy.yml

  dashboard-e2e:
    name: dashboard-e2e
    needs: changes
    if: needs.changes.outputs.dashboard_e2e == 'true'
    runs-on: ${{ github.actor == 'developerinlondon' && fromJSON('["self-hosted","linux","assay"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4.0.1
        with:
          version: 2026.4.17
          install: true
          cache: true

      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: "ci-x86_64-unknown-linux-gnu-v4"
          key: ${{ hashFiles('**/Cargo.lock') }}
          cache-all-crates: "true"
          cache-targets: "true"

      - name: Cache npm dependencies
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-dashboard-${{ hashFiles('crates/assay-workflow/tests-e2e/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-dashboard-
            npm-${{ runner.os }}-

      - name: Cache Playwright browsers
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-dashboard-${{ hashFiles('crates/assay-workflow/tests-e2e/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-dashboard-
            playwright-${{ runner.os }}-

      - name: Wipe stale dashboard e2e state (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          rm -rf /tmp/assay-e2e.* /tmp/assay-e2e-*.toml /tmp/assay-e2e-*.log
          rm -f  /tmp/engine.db /tmp/engine.db-* \
                 /tmp/auth.db   /tmp/auth.db-* \
                 /tmp/vault.db  /tmp/vault.db-* \
                 /tmp/workflow.db /tmp/workflow.db-*

      - name: moon run dashboard-e2e:test
        run: moon run dashboard-e2e:test --color
        env:
          MOON_LOG: "info"

      - name: Upload dashboard Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-e2e-report
          path: |
            crates/assay-workflow/tests-e2e/playwright-report
            crates/assay-workflow/tests-e2e/test-results
            /tmp/assay-e2e-engine.log
            /tmp/assay-e2e-worker.log
          if-no-files-found: ignore
          retention-days: 7

  engine-e2e:
    name: engine-e2e
    needs: changes
    if: needs.changes.outputs.engine_e2e == 'true'
    runs-on: ${{ github.actor == 'developerinlondon' && fromJSON('["self-hosted","linux","assay"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4.0.1
        with:
          version: 2026.4.17
          install: true
          cache: true

      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: "ci-x86_64-unknown-linux-gnu-v4"
          key: ${{ hashFiles('**/Cargo.lock') }}
          cache-all-crates: "true"
          cache-targets: "true"

      - name: Cache npm dependencies
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-engine-${{ hashFiles('crates/assay-engine/tests-e2e/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-engine-
            npm-${{ runner.os }}-

      - name: Cache Playwright browsers
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-engine-${{ hashFiles('crates/assay-engine/tests-e2e/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-engine-
            playwright-${{ runner.os }}-

      - name: Wipe stale engine e2e state (self-hosted)
        if: runner.environment == 'self-hosted'
        run: rm -rf /tmp/assay-engine-e2e-* /tmp/assay-engine-e2e.log

      - name: moon run engine-e2e:test
        run: moon run engine-e2e:test --color
        env:
          MOON_LOG: "info"

      - name: Upload engine Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: engine-e2e-report
          path: |
            crates/assay-engine/tests-e2e/playwright-report
            crates/assay-engine/tests-e2e/test-results
            /tmp/assay-engine-e2e.log
          if-no-files-found: ignore
          retention-days: 7

  # Dedicated extension gate so an extension-only break fails this job
  # specifically rather than hiding behind a generic "moon ci failed".
  extension-tests:
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ${{ github.actor == 'developerinlondon' && fromJSON('["self-hosted","linux","assay"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4.0.1
        with:
          version: 2026.4.17
          install: true
          cache: true

      - name: moon run openclaw-extension:test
        run: moon run openclaw-extension:test --color
        env:
          MOON_LOG: "info"

  # Browser-side UI tests for libs/sysops/ — orchestrated by moon
  # (project: sysops-e2e, task: test). The task definition handles
  # the assay-lua build + npm install + playwright install + run.sh
  # boot/teardown.
  sysops-e2e:
    name: sysops-e2e
    needs: changes
    # Heavy browser-test job. Triggered only when libs/sysops/ changes;
    # Assay/runtime, extension, docs, and CI-only PRs do not pay this cycle.
    if: needs.changes.outputs.sysops == 'true'
    runs-on: ${{ github.actor == 'developerinlondon' && fromJSON('["self-hosted","linux","assay"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          # Moon needs main to compute affected projects.
          fetch-depth: 0

      - uses: jdx/mise-action@v4.0.1
        with:
          version: 2026.4.17
          install: true
          cache: true

      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: "ci-x86_64-unknown-linux-gnu-v4"
          key: ${{ hashFiles('**/Cargo.lock') }}
          cache-all-crates: "true"
          cache-targets: "true"

      - name: Cache npm dependencies
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-sysops-${{ hashFiles('libs/sysops/tests-e2e/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-sysops-
            npm-${{ runner.os }}-

      - name: Cache Playwright browsers
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-sysops-${{ hashFiles('libs/sysops/tests-e2e/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-sysops-
            playwright-${{ runner.os }}-

      - name: moon run sysops-e2e:test
        run: moon run sysops-e2e:test --color
        env:
          MOON_LOG: "info"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sysops-e2e-report
          path: |
            libs/sysops/tests-e2e/playwright-report
            libs/sysops/tests-e2e/test-results
            /tmp/sysops-e2e.log
          if-no-files-found: ignore
          retention-days: 7

  # Route-level smoke against libs/sysops/ — moon project `sysops`,
  # task `smoke`. Boots the lib in-process with stub services and
  # asserts representative routes return 2xx with the expected content.
  sysops-smoke:
    name: sysops-smoke
    needs: changes
    # Same trigger narrowing as sysops-e2e.
    if: needs.changes.outputs.sysops == 'true'
    runs-on: ${{ github.actor == 'developerinlondon' && fromJSON('["self-hosted","linux","assay"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # Moon needs main to compute affected projects.
          fetch-depth: 0

      - uses: jdx/mise-action@v4.0.1
        with:
          version: 2026.4.17
          install: true
          cache: true

      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: "ci-x86_64-unknown-linux-gnu-v4"
          key: ${{ hashFiles('**/Cargo.lock') }}
          cache-all-crates: "true"
          cache-targets: "true"

      - name: moon run sysops:smoke
        run: moon run sysops:smoke --color
        env:
          MOON_LOG: "info"

  # Catches public-API drift in workspace crates so the release-time
  # `cargo publish --verify` step doesn't fail on a method that was
  # added to a workspace dep without bumping that dep's Cargo.toml.
  semver-checks:
    name: cargo-semver-checks
    needs: changes
    if: needs.changes.outputs.assay_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          # assay-authz has no crates.io release to diff against yet, and
          # the tool errors rather than skipping on a missing baseline.
          # Drop this once its first version is published.
          exclude: assay-authz
